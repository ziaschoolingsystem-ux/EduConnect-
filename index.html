:root{color-scheme:light;--ink:#0B3D2E;--ink2:#4B6B5E;--sky:#14A06A;--mint:#17B890;--bus:#FFC93C;--coral:#FF6B5B;--paper:#F2FBF5;--card:#fff;--line:#D3EADB;--r:18px;

*{box-sizing:border-box;margin:0}
body{font-family:var(--ur);background:var(--paper);color:var(--ink);line-height:1.8;min-height:100vh}
html[lang=en] body{font-family:var(--en);line-height:1.6}
a{color:var(--sky)}
:focus-visible{outline:3px solid var(--bus);outline-offset:2px}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:20px}
header.top{position:sticky;top:0;z-index:5;background:#0E8F63;color:#fff}
header.top .wrap{display:flex;align-items:center;gap:10px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;cursor:pointer;margin-inline-end:auto;font-family:var(--en)}
.logo i{width:38px;height:38px;border-radius:12px;background:var(--bus);display:grid;place-items:center}
.logo svg{width:24px;fill:#0B3D2E}
.btn{font:inherit;font-weight:700;border:2px solid currentColor;background:transparent;color:inherit;padding:8px 20px;border-radius:999px;cursor:pointer;transition:.15s}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:var(--sky);border-color:var(--sky);color:#fff}.hero .btn.pri{background:var(--bus);border-color:var(--bus);color:#0B3D2E}
.btn.bus{background:var(--bus);border-color:var(--bus);color:#0B3D2E}
.btn.sm{padding:3px 14px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:wait}
/* ہیرو: اسکول بس کی پٹی */
.hero{background:linear-gradient(160deg,#0E8F63,#2BC48A);color:#fff;padding-block:56px 64px;position:relative}
.hero::after{content:"";position:absolute;inset-inline:0;bottom:0;height:16px;background:repeating-linear-gradient(-45deg,var(--bus) 0 18px,#fff 18px 36px)}
.hero h1{font-family:'Noto Nastaliq Urdu',serif;font-weight:700;font-size:clamp(2rem,6vw,3.6rem);line-height:2;max-width:14em;color:#fff}
html[lang=en] .hero h1{font-family:var(--en);font-weight:800;line-height:1.15;letter-spacing:-.02em}
.hero p{max-width:34em;color:#EAFFF4;font-size:1.1rem;margin-block:12px 24px}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn:not(.pri):not(.bus){color:#fff}
.price{display:inline-flex;gap:8px 20px;margin-top:28px;padding:12px 20px;background:rgba(255,255,255,.18);border-radius:var(--r);flex-wrap:wrap}
.price b{color:var(--bus)}
section.blk{padding-block:32px 8px}
h2{font-size:1.5rem;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.grid .card{margin:0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.steps .card{margin:0;font-weight:700}
.steps b{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--coral);color:#fff;margin-bottom:8px;font-family:var(--en)}
.steps .card:nth-child(2) b{background:var(--mint)}.steps .card:nth-child(3) b{background:var(--sky)}
.school{display:flex;gap:14px;align-items:center}
.av{width:48px;height:48px;border-radius:14px;background:var(--mint);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.2rem;flex:none}
.muted{color:var(--ink2);font-size:.92rem}
input,select{font:inherit;width:100%;padding:11px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus,select:focus{border-color:var(--sky);outline:none}
label{display:block;font-weight:500;margin-block:12px 4px}
.auth{max-width:440px;margin:40px auto}
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:999px;margin-bottom:8px}
.tabs button{flex:1;font:inherit;border:0;padding:8px;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;font-weight:500}
.tabs button.on{background:var(--sky);color:#fff;font-weight:700}
.err{color:var(--coral);font-size:.92rem;min-height:1.4em;margin-top:10px}
.dash{display:grid;grid-template-columns:230px 1fr;gap:24px;padding-block:24px}
.dash:has(> .col:only-child){grid-template-columns:1fr}
.side{display:flex;flex-direction:column;gap:4px}
.side a{padding:10px 14px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:500;cursor:pointer}
.side a:hover{background:var(--line)}
.side a.on{background:var(--sky);color:#fff}
.side a.soon{opacity:.5}
.welcome{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.welcome h2{margin:0}
.badge{display:inline-block;background:var(--bus);color:#0B3D2E;font-weight:700;border-radius:999px;padding:2px 14px;font-size:.85rem}
.stat b{display:block;font-size:1.7rem}

.stat.gold b{font-size:2.6rem;font-family:var(--en)}
.pay{border-color:var(--mint)}

.warn{background:#FFF3D6;color:#5B3B00;border:2px solid var(--bus);border-radius:var(--r);padding:12px 16px;margin-bottom:16px}
#toast{position:fixed;inset-inline:0;bottom:24px;margin:auto;width:max-content;max-width:90vw;background:#0B3D2E;color:#fff;padding:10px 22px;border-radius:999px;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:none}
@media(max-width:760px){.dash{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto}.side a{white-space:nowrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
#pa{display:none}.pp{color:#000;font-family:inherit}.pp table{margin-bottom:12px}.pp td,.pp th{border:1px solid #999;padding:6px 10px}@media print{body.printing #app,body.printing #toast{display:none!important}body.printing #pa{display:block}body{background:#fff}.pp button,.pp input{display:none}}

        }
        b.set(doc(db, "users", uid), u); await b.commit();
        sendEmailVerification(c.user).then(() => toast(t().verify)).catch(() => {});
      }
    } catch (x) { err(x.code || x.message); $("#go").disabled = false; }
  };
}

// ---------- QR کوڈ بنانے والا (بائٹ موڈ، ورژن 1 سے 3، ECC=M) ----------
const QRM = (() => {
  const EXP = new Array(512), LOG = new Array(256); let x = 1;
  for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11d; }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  const mul = (a, b) => a && b ? EXP[LOG[a] + LOG[b]] : 0;
  const rs = (data, n) => { let g = [1]; for (let i = 0; i < n; i++) { const ng = new Array(g.length + 1).fill(0); g.forEach((c, j) => { ng[j] ^= c; ng[j + 1] ^= mul(c, EXP[i]); }); g = ng; }
    const r = new Array(n).fill(0); data.forEach(d => { const f = d ^ r[0]; r.shift(); r.push(0); g.slice(1).forEach((c, j) => { r[j] ^= mul(c, f); }); }); return r; };
  const CAP = [null, [16, 10], [28, 16], [44, 26]];
  const MK = [(r, c) => (r + c) % 2 === 0, (r, c) => r % 2 === 0, (r, c) => c % 3 === 0, (r, c) => (r + c) % 3 === 0, (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
    (r, c) => (r * c) % 2 + (r * c) % 3 === 0, (r, c) => ((r * c) % 2 + (r * c) % 3) % 2 === 0, (r, c) => ((r + c) % 2 + (r * c) % 3) % 2 === 0];
  return text => {
    const b = [...new TextEncoder().encode(text)]; let v = 1; while (v < 3 && b.length > CAP[v][0] - 2) v++; if (b.length > CAP[v][0] - 2) return null;
    const [dc, ec] = CAP[v], bits = [], put = (val, k) => { for (let i = k - 1; i >= 0; i--) bits.push((val >> i) & 1); };
    put(4, 4); put(b.length, 8); b.forEach(c => put(c, 8)); put(0, Math.min(4, dc * 8 - bits.length)); while (bits.length % 8) bits.push(0);
    const cw = []; for (let i = 0; i < bits.length; i += 8) cw.push(parseInt(bits.slice(i, i + 8).join(""), 2));
    for (let p = 0; cw.length < dc; p++) cw.push(p % 2 ? 0x11 : 0xec);
    const stream = []; cw.concat(rs(cw, ec)).forEach(c => { for (let i = 7; i >= 0; i--) stream.push((c >> i) & 1); }); if (v > 1) for (let i = 0; i < 7; i++) stream.push(0);
    const n = 17 + 4 * v, M = Array.from({ length: n }, () => new Array(n).fill(null)), set = (r, c, val) => { if (r >= 0 && r < n && c >= 0 && c < n) M[r][c] = val; };
    const finder = (r, c) => { for (let i = -1; i <= 7; i++) for (let j = -1; j <= 7; j++) set(r + i, c + j, i >= 0 && i <= 6 && j >= 0 && j <= 6 && (i === 0 || i === 6 || j === 0 || j === 6 || (i >= 2 && i <= 4 && j >= 2 && j <= 4)) ? 1 : 0); };
    finder(0, 0); finder(0, n - 7); finder(n - 7, 0);
    for (let i = 8; i < n - 8; i++) { set(6, i, i % 2 ? 0 : 1); set(i, 6, i % 2 ? 0 : 1); }
    if (v > 1) { const c = n - 7; for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) set(c + i, c + j, Math.max(Math.abs(i), Math.abs(j)) !== 1 ? 1 : 0); }
    for (let i = 0; i < 9; i++) { if (M[8][i] === null) M[8][i] = 0; if (M[i][8] === null) M[i][8] = 0; }
    for (let i = 0; i < 8; i++) { if (M[8][n - 1 - i] === null) M[8][n - 1 - i] = 0; if (M[n - 1 - i][8] === null) M[n - 1 - i][8] = 0; }
    M[n - 8][8] = 1;
    const fixed = M.map(r => r.map(z => z !== null)); let k = 0, up = true;
    for (let c = n - 1; c > 0; c -= 2) { if (c === 6) c = 5; for (let t = 0; t < n; t++) { const r = up ? n - 1 - t : t; for (let d = 0; d < 2; d++) if (!fixed[r][c - d]) M[r][c - d] = stream[k++] || 0; } up = !up; }
    const fmt = m => { let r = m << 10; for (let i = 14; i >= 10; i--) if ((r >> i) & 1) r ^= 0x537 << (i - 10); return ((m << 10) | r) ^ 0x5412; };
    const build = m => { const G = M.map((row, r) => row.map((z, c) => fixed[r][c] ? z : (MK[m](r, c) ? z ^ 1 : z))), f = fmt(m), bit = i => (f >> i) & 1;
      for (let i = 0; i <= 5; i++) G[i][8] = bit(i); G[7][8] = bit(6); G[8][8] = bit(7); G[8][7] = bit(8); for (let i = 9; i < 15; i++) G[8][14 - i] = bit(i);
      for (let i = 0; i < 8; i++) G[8][n - 1 - i] = bit(i); for (let i = 8; i < 15; i++) G[n - 15 + i][8] = bit(i); G[n - 8][8] = 1; return G; };
    const pen = G => { let p = 0; for (let a = 0; a < 2; a++) for (let i = 0; i < n; i++) { let run = 1; for (let j = 1; j < n; j++) { const x = a ? G[j][i] : G[i][j], y = a ? G[j - 1][i] : G[i][j - 1]; if (x === y) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
      for (let i = 0; i < n - 1; i++) for (let j = 0; j < n - 1; j++) { const x = G[i][j]; if (x === G[i][j + 1] && x === G[i + 1][j] && x === G[i + 1][j + 1]) p += 3; }
      const P = [1, 0, 1, 1, 1, 0, 1], z4 = (L, a, b) => b <= L.length && a >= 0 && L.slice(a, b).every(v => !v);
      for (let a = 0; a < 2; a++) for (let i = 0; i < n; i++) { const L = []; for (let j = 0; j < n; j++) L.push(a ? G[j][i] : G[i][j]); for (let j = 0; j + 7 <= n; j++) if (P.every((v, k) => L[j + k] === v) && (z4(L, j - 4, j) || z4(L, j + 7, j + 11))) p += 40; }
      const dark = G.flat().filter(Boolean).length; return p + Math.floor(Math.abs(dark * 20 - n * n * 10) / (n * n)) * 10; };
    let best = null, bp = 1e9; for (let m = 0; m < 8; m++) { const G = build(m), p = pen(G); if (p < bp) { bp = p; best = G; } } return best;
  };
})();
const qrSvg = (text, px = 150) => { const G = QRM(text); if (!G) return ""; const n = G.length, q = 4, W = n + 2 * q; let d = "";
  G.forEach((row, r) => row.forEach((v, c) => { if (v) d += `M${c + q} ${r + q}h1v1h-1z`; }));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${W}" width="${px}" height="${px}" shape-rendering="crispEdges"><rect width="${W}" height="${W}" fill="#fff"/><path d="${d}"/></svg>`; };

async function qrScan(onCode, onStop) {
  if (!("BarcodeDetector" in window) || !navigator.mediaDevices) return toast(t().noQr);
  let stream, timer; const ov = document.createElement("div"); ov.className = "qrov";
  ov.innerHTML = `<video playsinline muted autoplay></video><div class="qrb"><b id="qrc">0</b><button class="btn bus" id="qrx">${t().qrStop}</button></div>`; document.body.appendChild(ov);
  const stop = () => { clearInterval(timer); if (stream) stream.getTracks().forEach(x => x.stop()); ov.remove(); if (onStop) onStop(); };
  $("#qrx").onclick = stop;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }); } catch (e) { ov.remove(); return toast(t().noQr); }
  const v = ov.querySelector("video"); v.srcObject = stream; await v.play().catch(() => {});
  const det = new BarcodeDetector({ formats: ["qr_code"] }); let n = 0;
  timer = setInterval(async () => { try { (await det.detect(v)).forEach(b => { const m = /^ec1\|(\S+)$/.exec(b.rawValue || ""); if (m && onCode(m[1])) $("#qrc").textContent = ++n; }); } catch (e) { /* فریم تیار نہیں */ } }, 350);
}

const MSG = ["علم حاصل کرو، یہی کامیابی کی پہلی سیڑھی ہے۔", "آج کا کام آج ہی کرو، کل پر مت چھوڑو۔", "محنت کرنے والے کبھی خالی ہاتھ نہیں لوٹتے۔", "چھوٹی چھوٹی کوششیں مل کر بڑی کامیابی بنتی ہیں۔", "سچ بولنا سب سے بڑی عادت ہے۔", "پڑھنے کی عادت ڈالو، دنیا تمہاری ہو جائے گی۔", "ہر دن کچھ نیا سیکھو۔", "استاد کا احترام علم کی پہلی شرط ہے۔", "وقت کی قدر کرو، یہ لوٹ کر نہیں آتا۔", "غلطی سے سیکھنے والا کبھی ہارتا نہیں۔", "اچھے اخلاق سب سے بڑی دولت ہیں۔", "خواب دیکھو اور ان کے لیے محنت کرو۔", "صبر اور مستقل مزاجی کامیابی کی کنجی ہیں۔", "علم بانٹنے سے بڑھتا ہے۔"];
const dayMsg = () => MSG[Math.floor(Date.now() / 864e5) % MSG.length];
const QB = [
  ["پاکستان کا دارالحکومت کون سا ہے؟", ["کراچی", "اسلام آباد", "لاہور", "پشاور"], 1], ["پاکستان کا قومی پھول کون سا ہے؟", ["گلاب", "چنبیلی", "سورج مکھی", "کنول"], 1],
  ["قائداعظم کا اصل نام کیا تھا؟", ["محمد علی جناح", "لیاقت علی خان", "علامہ اقبال", "سر سید احمد خان"], 0], ["رقبے کے لحاظ سے پاکستان کا سب سے بڑا صوبہ کون سا ہے؟", ["پنجاب", "سندھ", "بلوچستان", "خیبر پختونخوا"], 2],
  ["دنیا کی سب سے بلند چوٹی کون سی ہے؟", ["کے ٹو", "ماؤنٹ ایورسٹ", "نانگا پربت", "کلیمنجارو"], 1], ["پاکستان کا قومی کھیل کون سا ہے؟", ["کرکٹ", "ہاکی", "فٹبال", "کبڈی"], 1],
  ["اسلام کے کتنے ارکان ہیں؟", ["3", "4", "5", "6"], 2], ["قرآن کی پہلی نازل ہونے والی آیات کس سورت کی ہیں؟", ["الفاتحہ", "البقرہ", "العلق", "یٰسین"], 2],
  ["ہجری سال کا پہلا مہینہ کون سا ہے؟", ["رمضان", "محرم", "رجب", "شوال"], 1], ["خاتم النبیین کا لقب کس کا ہے؟", ["حضرت موسیٰ علیہ السلام", "حضرت عیسیٰ علیہ السلام", "حضرت محمد ﷺ", "حضرت ابراہیم علیہ السلام"], 2],
  ["قرآن مجید کے کل کتنے پارے ہیں؟", ["20", "25", "30", "40"], 2], ["خانہ کعبہ کس شہر میں ہے؟", ["مدینہ منورہ", "مکہ مکرمہ", "جدہ", "طائف"], 1],
  ["\"Book\" کا اردو مطلب کیا ہے؟", ["قلم", "کتاب", "کاپی", "بستہ"], 1], ["Opposite of \"Hot\" is:", ["Big", "Cold", "Tall", "Fast"], 1],
  ["She ___ a student.", ["am", "is", "are", "be"], 1], ["How many days are there in a week?", ["Five", "Six", "Seven", "Eight"], 2],
  ["Plural of \"child\" is:", ["childs", "children", "childes", "child"], 1], ["Past tense of \"go\" is:", ["goed", "gone", "went", "going"], 2],
  ["پانی کا کیمیائی فارمولا کیا ہے؟", ["CO2", "H2O", "O2", "NaCl"], 1], ["سورج کس قسم کا فلکی جسم ہے؟", ["سیارہ", "ستارہ", "چاند", "سیارچہ"], 1],
  ["انسانی جسم میں خون پمپ کرنے والا عضو کون سا ہے؟", ["جگر", "دل", "گردہ", "پھیپھڑے"], 1], ["پودے سورج کی روشنی سے خوراک کیسے بناتے ہیں؟", ["تنفس", "ضیائی تالیف", "تبخیر", "ہضم"], 1],
  ["ہمارے نظام شمسی کا سب سے بڑا سیارہ کون سا ہے؟", ["زمین", "مریخ", "مشتری", "زحل"], 2], ["ہوا میں سب سے زیادہ مقدار کس گیس کی ہے؟", ["آکسیجن", "نائٹروجن", "کاربن ڈائی آکسائیڈ", "ہائیڈروجن"], 1]];
async function quizPage(pg) {
  const d = Math.floor(Date.now() / 864e5), today = new Date().toISOString().slice(0, 10), Q = [0, 1, 2, 3].map(j => QB[(d * 5 + j * 6) % QB.length]); let me = null, top = [];
  try { const s = await getDoc(doc(db, "quiz", user.uid)); me = s.exists() ? s.data() : null; } catch (e) { console.warn(e); }
  try { top = (await getDocs(query(collection(db, "quiz"), orderBy("points", "desc"), limit(10)))).docs.map(x => x.data()); } catch (e) { console.warn(e); }
  const done = me && me.last === today, days = me?.days || 0;
  pg.innerHTML = `<div class="card hero2"><h2>🧠 ${t().m.quiz}</h2><div>💡 ${dayMsg()}</div></div>
   <div class="grid" style="margin-block:12px"><div class="card stat"><span>${t().pts}</span><b>${me?.points || 0}</b></div><div class="card stat"><span>🔥 ${t().streak}</span><b>${me?.streak || 0}</b></div><div class="card stat gold"><span>${t().chal14}</span><b>${Math.min(days, 14)}/14</b></div></div>
   <div id="qz">${done ? `<div class="card">✅ ${t().qDone}</div>` : ""}</div><h3 style="margin-top:16px">🏅 ${t().board}</h3>${top.map((x, i) => `<div class="card row2"><span>${i + 1}. ${esc(x.name)}</span><b>${x.points}</b></div>`).join("") || `<p class="muted">${t().none2}</p>`}`;
  if (done) return;
  let i = 0, sc = 0;
  const finish = async () => { const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10), nd = { name: profile.name, points: (me?.points || 0) + sc * 5, streak: me && me.last === y ? (me.streak || 0) + 1 : 1, days: days + 1, last: today };
    try { await setDoc(doc(db, "quiz", user.uid), nd); toast("🎉 " + sc + "/" + Q.length); quizPage(pg); } catch (e) { toast(e.code); } };
  const show = () => { if (i >= Q.length) return finish(); const q = Q[i];
    $("#qz").innerHTML = `<div class="card"><p class="muted">${i + 1}/${Q.length}</p><h3>${esc(q[0])}</h3>${q[1].map((o, k) => `<button class="btn" data-k="${k}" style="display:block;width:100%;margin-top:8px">${esc(o)}</button>`).join("")}</div>`;
    document.querySelectorAll("#qz [data-k]").forEach(b => b.onclick = () => { const ok = +b.dataset.k === q[2]; if (ok) sc++; toast(ok ? "✅" : "❌ " + q[1][q[2]]); i++; setTimeout(show, 700); }); };
  show();
}

// ---------- ڈیش بورڈ ----------
const LIVE = ["home", "community", "students", "attendance", "staff", "fees", "finance", "admin", "teachers", "exams", "profile", "children", "results", "notices", "daily", "tatt", "events", "videos", "awards", "quiz"];
const ALL = ["home", "staff", "students", "teachers", "tatt", "attendance", "notices", "daily", "events", "videos", "awards", "fees", "finance", "exams", "profile", "quiz", "community"];
async function dashboard() {
  const st = subState();
  if (profile.blocked) return lockView("acct");
  if (st === "blocked") return lockView("blocked");
  if (st === "locked") return profile.role === "principal" ? payView() : lockView("expired");
  const viewer = profile.role === "viewer", ok = k => ["home", "community", "quiz"].includes(k) || (k === "profile" ? profile.role === "principal" : ["staff", "teachers", "tatt"].includes(k) ? BOSS() : can(MP[k]));
  const adm = profile.role === "admin", items = adm ? ["home", "admin", "community"] : viewer ? MENU.viewer : profile.role === "parent" ? MENU.parent : ALL.filter(ok), days = Math.max(0, Math.ceil((ms(school?.trialEnds) - Date.now()) / 864e5));
  if (!items.includes(page)) page = "home";
  app$.innerHTML = header() + `<main class="wrap dash">${viewer ? "" : `<nav class="side" aria-label="${t().menu}">${items.map(k => `<a data-k="${k}" class="${k === page ? "on" : LIVE.includes(k) ? "" : "soon"}">${t().m[k]}</a>`).join("")}</nav>`}<div class="col">${viewer ? "" : `<div class="tb"><button class="btn sm" id="pp0">🖨 ${t().print} / PDF</button></div>`}<div id="pg"></div></div></main>`;
  bindHeader(); if ($("#pp0")) $("#pp0").onclick = printPage;
  document.querySelectorAll(".side a").forEach(a => a.onclick = () => { if (!LIVE.includes(a.dataset.k)) return toast(t().soon); page = a.dataset.k; dashboard(); });
  const pg = $("#pg"), PGS = profile.role === "parent" ? { community: () => community(pg, false), children: () => parentPage(pg, "children"), quiz: () => quizPage(pg), events: () => eventsPage(pg, false), videos: () => videosPage(pg, false), awards: () => awardsPage(pg, false), notices: () => parentNotices(pg), daily: () => parentDaily(pg), fees: () => parentPage(pg, "fees"), results: () => parentPage(pg, "results") } : { teachers: () => teachersPage(pg), quiz: () => quizPage(pg), events: () => eventsPage(pg, true), videos: () => videosPage(pg, true), awards: () => awardsPage(pg, true), tatt: () => tAttPage(pg), notices: () => noticesPage(pg), daily: () => dailyPage(pg), exams: () => resultsPage(pg), profile: () => profPage(pg), community: () => community(pg, can("post")), students: () => studentsPage(pg), attendance: () => attPage(pg), staff: () => staffPage(pg), fees: () => feesPage(pg), finance: () => finPage(pg), admin: () => adminPage(pg) };
  if (!viewer && PGS[page]) return PGS[page]();
  const needV = !user.emailVerified && ["principal", "viewer"].includes(profile.role);
  pg.innerHTML = `<div class="welcome hero2"><h2>${t().welcome}، ${esc(profile.name)}</h2><span class="badge">${t().roles[profile.role] || ""}</span><div style="flex-basis:100%">💡 ${dayMsg()}</div></div>
   ${needV ? `<div class="warn">${t().verify} <button class="btn sm" id="vr">${t().verified}</button></div>` : ""}
   ${viewer ? `<p class="muted" style="margin-bottom:16px">${t().pubOnly}</p><div class="seg" style="margin-bottom:12px"><button type="button" data-vp="c" class="on">${t().m.community}</button><button type="button" data-vp="q">🧠 ${t().m.quiz}</button></div><div id="cm"></div>` : adm ? "" : `<div class="grid"><div class="card stat"><span class="muted">${esc(school.name)}</span><b>${t().stT[st]}</b></div>${st === "trial" ? `<div class="card stat gold"><span>${t().left}</span><b>${days}</b></div>` : ""}</div>`}`;
  if ($("#vr")) $("#vr").onclick = async () => { await user.reload(); dashboard(); };
  if (viewer) { const go = k => { document.querySelectorAll("[data-vp]").forEach(b => b.classList.toggle("on", b.dataset.vp === k)); if (k === "q") quizPage($("#cm")); else community($("#cm"), true); };
    document.querySelectorAll("[data-vp]").forEach(b => b.onclick = () => go(b.dataset.vp)); go("c"); }
  if (!viewer && !adm) homeGrid(pg, items);
  if (BOSS()) statsRow(pg);
  if (profile.role === "principal") followersCard(pg);
}

async function render() {
  if (user && !profile) { app$.innerHTML = header(); bindHeader(); return; }
  if (user) return dashboard();
  location.hash === "#demo" ? demoView() : location.hash === "#auth" ? authView() : landing();
}
getDoc(doc(db,"settings","app")).then(x=>{ if(x.exists()) Object.assign(CFG,x.data()); }).catch(()=>{});
onAuthStateChanged(auth, async u => {
  user = u; profile = school = null;
  if (u) {
    try { await u.reload(); } catch (e) {}
    // نیا اکاؤنٹ بنتے وقت دستاویز لکھنے میں لمحہ لگ سکتا ہے، اس لیے دوبارہ کوشش
    for (let i = 0; i < 5 && !profile; i++) { const s = await getDoc(doc(db, "users", u.uid)); if (s.exists()) profile = s.data(); else await new Promise(r => setTimeout(r, 600)); }
    if (profile?.schoolId) school = (await getDoc(doc(db, "schools", profile.schoolId))).data();
    location.hash = ""; page = "home";
  }
  render();
});
window.addEventListener("hashchange", render);
window.addEventListener("offline", () => toast(t().offl)); window.addEventListener("online", () => toast(t().onl));
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
setLang(lang);
</script>
