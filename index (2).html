<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduConnect</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230F2A3D'/><path d='M22 62V38l28-12 28 12v24L50 74z' fill='%23F2A93B'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@500;700&family=Noto+Sans+Arabic:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213D;--ink2:#4A5878;--sky:#3A6BFF;--mint:#17B890;--bus:#FFC93C;--coral:#FF5D5D;--paper:#F4F6FF;--card:#fff;--line:#DDE3F5;--r:18px;
--ur:'Noto Sans Arabic',sans-serif;--en:'Plus Jakarta Sans',sans-serif}
@media(prefers-color-scheme:dark){:root{--ink:#EEF1FF;--ink2:#A9B4D6;--paper:#0E1530;--card:#18214A;--line:#2A356A}}
*{box-sizing:border-box;margin:0}
body{font-family:var(--ur);background:var(--paper);color:var(--ink);line-height:1.8;min-height:100vh}
html[lang=en] body{font-family:var(--en);line-height:1.6}
a{color:var(--sky)}
:focus-visible{outline:3px solid var(--bus);outline-offset:2px}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:20px}
header.top{position:sticky;top:0;z-index:5;background:#14213D;color:#fff}
header.top .wrap{display:flex;align-items:center;gap:10px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;cursor:pointer;margin-inline-end:auto;font-family:var(--en)}
.logo i{width:38px;height:38px;border-radius:12px;background:var(--bus);display:grid;place-items:center}
.logo svg{width:24px;fill:#14213D}
.btn{font:inherit;font-weight:700;border:2px solid currentColor;background:transparent;color:inherit;padding:8px 20px;border-radius:999px;cursor:pointer;transition:.15s}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:var(--sky);border-color:var(--sky);color:#fff}
.btn.bus{background:var(--bus);border-color:var(--bus);color:#14213D}
.btn.sm{padding:3px 14px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:wait}
/* ہیرو: اسکول بس کی پٹی */
.hero{background:#14213D;color:#fff;padding-block:56px 64px;position:relative}
.hero::after{content:"";position:absolute;inset-inline:0;bottom:0;height:16px;background:repeating-linear-gradient(-45deg,var(--bus) 0 18px,#14213D 18px 36px)}
.hero h1{font-family:'Noto Nastaliq Urdu',serif;font-weight:700;font-size:clamp(2rem,6vw,3.6rem);line-height:2;max-width:14em;color:var(--bus)}
html[lang=en] .hero h1{font-family:var(--en);font-weight:800;line-height:1.15;letter-spacing:-.02em}
.hero p{max-width:34em;color:#C9D3F5;font-size:1.1rem;margin-block:12px 24px}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn:not(.pri):not(.bus){color:#fff}
.price{display:inline-flex;gap:8px 20px;margin-top:28px;padding:12px 20px;background:rgba(255,255,255,.1);border-radius:var(--r);flex-wrap:wrap}
.price b{color:var(--bus)}
section.blk{padding-block:32px 8px}
h2{font-size:1.5rem;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.grid .card{margin:0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.steps .card{margin:0;font-weight:700}
.steps b{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--coral);color:#fff;margin-bottom:8px;font-family:var(--en)}
.steps .card:nth-child(2) b{background:var(--mint)}.steps .card:nth-child(3) b{background:var(--sky)}
.school{display:flex;gap:14px;align-items:center}
.av{width:48px;height:48px;border-radius:14px;background:var(--mint);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.2rem;flex:none}
.muted{color:var(--ink2);font-size:.92rem}
input,select{font:inherit;width:100%;padding:11px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus,select:focus{border-color:var(--sky);outline:none}
label{display:block;font-weight:500;margin-block:12px 4px}
.auth{max-width:440px;margin:40px auto}
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:999px;margin-bottom:8px}
.tabs button{flex:1;font:inherit;border:0;padding:8px;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;font-weight:500}
.tabs button.on{background:var(--sky);color:#fff;font-weight:700}
.err{color:var(--coral);font-size:.92rem;min-height:1.4em;margin-top:10px}
.dash{display:grid;grid-template-columns:230px 1fr;gap:24px;padding-block:24px}
.dash:has(> #pg:only-child){grid-template-columns:1fr}
.side{display:flex;flex-direction:column;gap:4px}
.side a{padding:10px 14px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:500;cursor:pointer}
.side a:hover{background:var(--line)}
.side a.on{background:var(--sky);color:#fff}
.side a.soon{opacity:.5}
.welcome{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.welcome h2{margin:0}
.badge{display:inline-block;background:var(--bus);color:#14213D;font-weight:700;border-radius:999px;padding:2px 14px;font-size:.85rem}
.stat b{display:block;font-size:1.7rem}
.stat.gold{background:var(--bus);border-color:var(--bus);color:#14213D}
.stat.gold b{font-size:2.6rem;font-family:var(--en)}
.pay{border-color:var(--mint)}
.post.event{border-color:var(--coral)}
.warn{background:#FFF3D6;color:#5B3B00;border:2px solid var(--bus);border-radius:var(--r);padding:12px 16px;margin-bottom:16px}
#toast{position:fixed;inset-inline:0;bottom:24px;margin:auto;width:max-content;max-width:90vw;background:#14213D;color:#fff;padding:10px 22px;border-radius:999px;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:none}
@media(max-width:760px){.dash{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto}.side a{white-space:nowrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script type="module">

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);

const T = {
 ur:{ tag:"اسکول کا پورا نظام، ایک جگہ", sub:"طلبہ، اساتذہ، حاضری، فیس، امتحانات اور والدین سے رابطہ — سب کچھ اردو میں، موبائل پر بھی۔",

  welcome:"خوش آمدید", left:"ٹرائل کے باقی دن", menu:"مینو", soon:"جلد آ رہا ہے", back:"واپس", roles:{principal:"پرنسپل / مالک",teacher:"استاد",finance:"فنانس اسٹاف",parent:"والدین",viewer:"Viewer",admin:"ایڈمن"},

};
Object.assign(T.ur,{expired:"ٹرائل ختم ہو گیا",expNote:"سسٹم جاری رکھنے کے لیے سبسکرپشن ادا کریں۔ آپ کا تمام ڈیٹا محفوظ ہے۔",blocked:"یہ اسکول عارضی طور پر بند ہے۔ ایڈمن سے رابطہ کریں۔",staffLock:"اسکول کی سبسکرپشن ختم ہے۔ پرنسپل سے رابطہ کریں۔",
 bank:"بینک اکاؤنٹ",acNo:"اکاؤنٹ نمبر",acT:"ٹائٹل",method:"ادائیگی کا طریقہ",tid:"ٹرانزیکشن / رسید نمبر",amt:"رقم",total:"کل ادائیگی (سیٹ اپ + پہلا مہینہ)",monthOnly:"ماہانہ ادائیگی",sendPay:"ادائیگی جمع کریں",paidMsg:"شکریہ! ادائیگی موصول ہو گئی۔ تصدیق تک سسٹم چلتا رہے گا۔",
 s1:"اسکول رجسٹر کریں",s2:`${CFG.trialDays} دن مکمل مفت استعمال کریں`,s3:"پسند آئے تو سبسکرپشن لیں، ورنہ سسٹم رک جائے گا",
 write:"اسکول کی طرف سے کچھ لکھیں…",post:"پوسٹ",event:"ایونٹ",publish:"شائع کریں",nofeed:"ابھی کوئی پوسٹ نہیں۔",pubOnly:"آپ اسکولوں کی عوامی پوسٹس، تصاویر، ویڈیوز اور ایونٹس دیکھ سکتے ہیں۔",
 stT:{trial:"مفت ٹرائل",active:"سبسکرپشن فعال",grace:"ادائیگی کی تصدیق جاری"},feed:"تازہ ترین"});
Object.assign(T.en,{expired:"Your free trial has ended",expNote:"Subscribe to keep using the system. All your data is safe.",blocked:"This school is temporarily suspended. Contact the admin.",staffLock:"The school's subscription has ended. Contact your principal.",
 bank:"Bank account",acNo:"Account no.",acT:"Title",method:"Payment method",tid:"Transaction / receipt no.",amt:"Amount",total:"Total (setup + first month)",monthOnly:"Monthly payment",sendPay:"Submit payment",paidMsg:"Thank you! Payment received. The system stays on while we verify it.",
 s1:"Register your school",s2:`Use everything free for ${CFG.trialDays} days`,s3:"Like it? Subscribe. Otherwise the system pauses",
 write:"Write something for your school…",post:"Post",event:"Event",publish:"Publish",nofeed:"No posts yet.",pubOnly:"You can see schools' public posts, photos, videos and events.",
 stT:{trial:"Free trial",active:"Subscription active",grace:"Verifying payment"},feed:"Latest"});
// ہر کردار کو کون سے مینو ملتے ہیں (حصہ 2 میں اجازتوں کے ساتھ جوڑا جائے گا)
const MENU = { principal:["home","students","teachers","attendance","fees","finance","exams","profile","community","settings"],
  teacher:["home","students","attendance","exams","profile"], finance:["home","fees","finance","community"],
  parent:["home","children","fees","results","community"], viewer:["home"], admin:["home","community","settings"] };

let lang = localStorage.getItem("lang") || "ur", user = null, profile = null, school = null, tab = "school";
const t = () => T[lang], $ = s => document.querySelector(s), app$ = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const toast = m => { const e = $("#toast"); e.textContent = m; e.classList.add("show"); setTimeout(() => e.classList.remove("show"), 3200); };
const setLang = l => { lang = l; localStorage.setItem("lang", l); document.documentElement.lang = l; document.documentElement.dir = l === "ur" ? "rtl" : "ltr"; render(); };
const LOGO = `<i><svg viewBox="0 0 100 100"><path d="M10 40L50 20l40 20-40 20zM24 56v18c0 8 52 8 52 0V56L50 68z"/></svg></i>EduConnect`;

function header() {
  return `<header class="top"><div class="wrap"><div class="logo" onclick="location.hash=''">${LOGO}</div>
  <button class="btn sm" id="lg">${lang === "ur" ? "English" : "اردو"}</button>
  ${user ? `<button class="btn sm" id="out">${t().logout}</button>` : `<button class="btn sm pri" id="in">${t().login}</button>`}</div></header>`;
}
function bindHeader() {
  $("#lg").onclick = () => setLang(lang === "ur" ? "en" : "ur");
  if ($("#out")) $("#out").onclick = () => signOut(auth);
  if ($("#in")) $("#in").onclick = () => { tab = "login"; location.hash = "auth"; };
}

// ---------- ابتدائی صفحہ + ڈائریکٹری ----------
async function landing() {
  app$.innerHTML = header() + `<main><div class="hero"><div class="wrap"><h1>${t().tag}</h1><p>${t().sub}</p>
   <div class="row"><button class="btn pri" id="r1">${t().reg}</button><button class="btn" id="r2">${t().login}</button></div>
   <div class="price"><span>${t().trial}</span><span>${t().setup}: <b>${CFG.setup.toLocaleString()}</b> ${t().rs}</span><span>${t().price}: <b>${CFG.monthly}</b> ${t().rs}</span></div></div></div>
   <section class="blk"><div class="wrap steps"><div class="card"><b>1</b>${t().s1}</div><div class="card"><b>2</b>${t().s2}</div><div class="card"><b>3</b>${t().s3}</div></div></section>\n   <section class="blk"><div class="wrap"><h2>${t().dir}</h2><input id="q" placeholder="${t().search}" aria-label="${t().search}"><div class="grid" id="dirl" style="margin-top:16px"></div></div></section></main>`;
  bindHeader();
  $("#r1").onclick = () => { tab = "school"; location.hash = "auth"; };
  $("#r2").onclick = () => { tab = "login"; location.hash = "auth"; };
  let list = [];
  try { list = (await getDocs(query(collection(db, "schools"), where("isPublic", "==", true), where("status", "in", ["trial", "active"])))).docs.map(d => d.data()); } catch (e) { console.warn(e); }
  const draw = () => {
    const q = $("#q").value.trim().toLowerCase(), r = list.filter(s => (s.name || "").toLowerCase().includes(q));
    $("#dirl").innerHTML = r.length ? r.map(s => `<div class="card school"><div class="av">${esc((s.name || "?")[0])}</div><div><b>${esc(s.name)}</b><div class="muted">${esc(s.address)}</div></div></div>`).join("") : `<p class="muted">${t().none}</p>`;
  };
  $("#q").oninput = draw; draw();
}

// ---------- لاگ اِن / رجسٹریشن ----------
function authView() {
  const reg = tab !== "login";
  app$.innerHTML = header() + `<main class="wrap"><div class="card auth">
   <div class="tabs"><button data-t="school" class="${tab === "school" ? "on" : ""}">${t().tSchool}</button><button data-t="viewer" class="${tab === "viewer" ? "on" : ""}">${t().tViewer}</button><button data-t="login" class="${tab === "login" ? "on" : ""}">${t().login}</button></div>
   <form id="f" novalidate>
   ${reg ? `<label for="n">${t().name}</label><input id="n" autocomplete="name">` : ""}
   ${tab === "school" ? `<label for="s">${t().school}</label><input id="s"><label for="a">${t().address}</label><input id="a">` : ""}
   <label for="e">${t().email}</label><input id="e" type="email" dir="ltr" autocomplete="email">
   <label for="p">${t().pass}</label><input id="p" type="password" dir="ltr" autocomplete="${reg ? "new" : "current"}-password">
   <div class="err" id="er"></div>
   <button class="btn pri" style="width:100%;margin-top:8px" id="go">${reg ? t().go : t().login}</button>
   ${reg ? "" : `<p style="margin-top:14px"><a href="#" id="fp">${t().forgot}</a></p>`}</form></div></main>`;
  bindHeader();
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; authView(); });
  const v = id => ($("#" + id)?.value || "").trim(), err = m => $("#er").textContent = m;
  if ($("#fp")) $("#fp").onclick = async e => { e.preventDefault(); if (!/^\S+@\S+\.\S+$/.test(v("e"))) return err(t().bad);
    try { await sendPasswordResetEmail(auth, v("e")); err(""); toast(t().sent); } catch (x) { err(x.code); } };
  $("#f").onsubmit = async e => {
    e.preventDefault(); err("");
    if (!/^\S+@\S+\.\S+$/.test(v("e"))) return err(t().bad);
    if (v("p").length < 6) return err(t().short);
    if (reg && !v("n")) return err(t().need);
    if (tab === "school" && (!v("s") || !v("a"))) return err(t().need);
    $("#go").disabled = true;
    try {
      if (!reg) await signInWithEmailAndPassword(auth, v("e"), v("p"));
      else {
        const c = await createUserWithEmailAndPassword(auth, v("e"), v("p")), uid = c.user.uid, b = writeBatch(db);
        const u = { name: v("n"), email: v("e"), role: tab === "school" ? "principal" : "viewer", schoolId: null, createdAt: serverTimestamp() };
        if (tab === "school") {
          const sref = doc(db, "schools", uid); u.schoolId = sref.id;
          b.set(sref, { name: v("s"), address: v("a"), ownerId: uid, isPublic: true, status: "trial", createdAt: serverTimestamp(),
            trialEnds: new Date(Date.now() + CFG.trialDays * 864e5), plan: { monthly: CFG.monthly, setup: CFG.setup }, paidUntil: null, graceUntil: null });
        }
        b.set(doc(db, "users", uid), u); await b.commit();
        sendEmailVerification(c.user).then(() => toast(t().verify)).catch(() => {});
      }
    } catch (x) { err(x.code || x.message); $("#go").disabled = false; }
  };
}

// ---------- سبسکرپشن کی حالت (ٹرائل → ادائیگی → فعال، ورنہ بند) ----------
let page = "home";
const ms = x => x?.toDate ? x.toDate().getTime() : 0;
function subState() {
  if (!school) return "ok"; const n = Date.now();
  if (school.status === "blocked") return "blocked";
  if (ms(school.paidUntil) > n) return "active"; if (ms(school.graceUntil) > n) return "grace";
  return ms(school.trialEnds) > n ? "trial" : "locked";
}
function lockView(msg) { app$.innerHTML = header() + `<main class="wrap"><div class="card auth" style="text-align:center"><h2>🔒 ${t().expired}</h2><p class="muted">${msg === "blocked" ? t().blocked : t().staffLock}</p></div></main>`; bindHeader(); }
function payView() {
  const P = CFG.pay, first = !school.paidUntil, due = (first ? CFG.setup : 0) + CFG.monthly;
  app$.innerHTML = header() + `<main class="wrap"><h2 style="margin-top:28px">🔒 ${t().expired}</h2><p class="muted">${t().expNote}</p>
  <div class="grid" style="margin-block:16px"><div class="card pay"><b>🏦 ${t().bank}</b><p>${esc(P.bankName)}<br>${t().acT}: ${esc(P.title)}<br>${P.account ? `${t().acNo}: <span dir="ltr">${esc(P.account)}</span><br>` : ""}IBAN: <span dir="ltr">${esc(P.iban)}</span></p></div>
  <div class="card pay"><b>📱 Easypaisa</b><p>${esc(P.epTitle)}<br><span dir="ltr">${esc(P.easypaisa)}</span></p></div></div>
  <form class="card" id="pf" style="max-width:460px"><p><b>${first ? t().total : t().monthOnly}: ${due.toLocaleString()} ${t().rs}</b></p>
  <label for="pm">${t().method}</label><select id="pm"><option>Easypaisa</option><option>${t().bank}</option></select>
  <label for="pt">${t().tid}</label><input id="pt" dir="ltr"><div class="err" id="er"></div><button class="btn pri" style="margin-top:8px">${t().sendPay}</button></form></main>`;
  bindHeader();
  $("#pf").onsubmit = async e => { e.preventDefault(); const tid = $("#pt").value.trim(); if (tid.length < 6) return $("#er").textContent = t().need;
    try {
      await addDoc(collection(db, "schools", profile.schoolId, "paymentRequests"), { method: $("#pm").value, tid, amount: due, status: "pending", by: user.uid, createdAt: serverTimestamp() });
      const g = new Date(Date.now() + CFG.graceDays * 864e5); await updateDoc(doc(db, "schools", profile.schoolId), { graceUntil: g });
      school.graceUntil = { toDate: () => g }; toast(t().paidMsg); dashboard();
    } catch (x) { $("#er").textContent = x.code; } };
}

// ---------- پوسٹس / ایونٹس (عوامی) ----------
async function feed(box, canPost) {
  box.innerHTML = `${canPost ? `<form class="card" id="cf"><select id="ck" style="width:auto"><option value="post">${t().post}</option><option value="event">${t().event}</option></select>
   <input id="ct" placeholder="${t().write}" style="margin-block:10px"><button class="btn pri sm">${t().publish}</button></form>` : ""}<h2>${t().feed}</h2><div id="fl"></div>`;
  const draw = async () => {
    let r = []; try { r = (await getDocs(query(collection(db, "publicPosts"), orderBy("createdAt", "desc"), limit(30)))).docs.map(d => ({ id: d.id, ...d.data() })); } catch (e) { console.warn(e); }
    $("#fl").innerHTML = r.length ? r.map(p => `<article class="card post ${p.kind}"><div class="school"><div class="av">${esc((p.schoolName || "?")[0])}</div><div><b>${esc(p.schoolName)}</b><div class="muted">${p.kind === "event" ? "📅 " + t().event : ""}</div></div></div>
      <p>${esc(p.text)}</p><button class="btn sm" data-l="${p.id}">❤ ${p.likes || 0}</button></article>`).join("") : `<p class="muted">${t().nofeed}</p>`;
    document.querySelectorAll("[data-l]").forEach(b => b.onclick = async () => { try { await updateDoc(doc(db, "publicPosts", b.dataset.l), { likes: increment(1) }); draw(); } catch (e) { toast(e.code); } });
  };
  if (canPost) $("#cf").onsubmit = async e => { e.preventDefault(); const x = $("#ct").value.trim(); if (!x) return;
    await addDoc(collection(db, "publicPosts"), { schoolId: profile.schoolId, schoolName: school.name, authorName: profile.name, kind: $("#ck").value, text: x, likes: 0, createdAt: serverTimestamp() }); $("#ct").value = ""; draw(); };
  draw();
}

// ---------- ڈیش بورڈ ----------
const LIVE = ["home", "community"];
async function dashboard() {
  const st = subState();
  if (st === "blocked") return lockView("blocked");
  if (st === "locked") return profile.role === "principal" ? payView() : lockView("expired");
  const items = MENU[profile.role] || MENU.viewer, viewer = profile.role === "viewer", days = Math.max(0, Math.ceil((ms(school?.trialEnds) - Date.now()) / 864e5));
  app$.innerHTML = header() + `<main class="wrap dash">${viewer ? "" : `<nav class="side" aria-label="${t().menu}">${items.map(k => `<a data-k="${k}" class="${k === page ? "on" : LIVE.includes(k) ? "" : "soon"}">${t().m[k]}</a>`).join("")}</nav>`}
   <div id="pg"></div></main>`;
  bindHeader();
  document.querySelectorAll(".side a").forEach(a => a.onclick = () => { if (!LIVE.includes(a.dataset.k)) return toast(t().soon); page = a.dataset.k; dashboard(); });
  const pg = $("#pg");
  if (page === "community" && !viewer) return feed(pg, profile.role === "principal");
  pg.innerHTML = `<div class="welcome"><h2>${t().welcome}، ${esc(profile.name)}</h2><span class="badge">${t().roles[profile.role] || ""}</span></div>
   ${!user.emailVerified ? `<div class="warn">${t().verify}</div>` : ""}
   ${viewer ? `<p class="muted" style="margin-bottom:16px">${t().pubOnly}</p><div id="fd"></div>` : `<div class="grid"><div class="card stat"><span class="muted">${esc(school.name)}</span><b>${t().stT[st]}</b></div>${st === "trial" ? `<div class="card stat gold"><span>${t().left}</span><b>${days}</b></div>` : ""}</div>`}`;
  if (viewer) feed($("#fd"), false);
}

async function render() {
  if (user && !profile) { app$.innerHTML = header(); bindHeader(); return; }
  if (user) return dashboard();
  location.hash === "#auth" ? authView() : landing();
}
getDoc(doc(db,"settings","app")).then(x=>{ if(x.exists()) Object.assign(CFG,x.data()); }).catch(()=>{});
onAuthStateChanged(auth, async u => {
  user = u; profile = school = null;
  if (u) {
    // نیا اکاؤنٹ بنتے وقت دستاویز لکھنے میں لمحہ لگ سکتا ہے، اس لیے دوبارہ کوشش
    for (let i = 0; i < 5 && !profile; i++) { const s = await getDoc(doc(db, "users", u.uid)); if (s.exists()) profile = s.data(); else await new Promise(r => setTimeout(r, 600)); }
    if (profile?.schoolId) school = (await getDoc(doc(db, "schools", profile.schoolId))).data();
    location.hash = ""; page = "home";
  }
  render();
});
window.addEventListener("hashchange", render);
setLang(lang);
</script>
